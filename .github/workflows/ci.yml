name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
  SIMFLEET_DEVICE_TYPE: iPhone 17
  SIMFLEET_OS_VERSION: "26.1"

jobs:
  unit:
    name: Unit and analysis checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select and verify Xcode 26.1.1
        run: |
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Using Xcode $xcode_version with iOS Simulator SDK $simulator_sdk"
          test "$xcode_version" = "26.1.1"
          test "$simulator_sdk" = "$SIMFLEET_OS_VERSION"
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Run unit tests
        run: bazel test --config=ci //simfleet:simulator_pool_test
      - name: Analyze the integration target
        run: bazel build --config=ci //tests/integration:MethodShardedUITests

  ui-integration:
    name: UI methods on 3 prepared simulators
    needs: unit
    runs-on: ${{ vars.SIMFLEET_MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select and verify Xcode 26.1.1
        run: |
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Using Xcode $xcode_version with iOS Simulator SDK $simulator_sdk"
          test "$xcode_version" = "26.1.1"
          test "$simulator_sdk" = "$SIMFLEET_OS_VERSION"
          xcrun simctl list runtimes --json | jq -e \
            --arg version "$SIMFLEET_OS_VERSION" \
            '.runtimes[] | select(.platform == "iOS" and .version == $version and .isAvailable == true)' \
            >/dev/null
          xcrun simctl list devicetypes --json | jq -e \
            --arg name "$SIMFLEET_DEVICE_TYPE" \
            '.devicetypes[] | select(.name == $name)' \
            >/dev/null
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Generate a CI proxy root certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj "/CN=SimFleet GitHub CI Root" \
            -keyout "$RUNNER_TEMP/simfleet-ci-root.key" \
            -out "$RUNNER_TEMP/simfleet-ci-root.pem"

      - name: Prepare three stable certificate-ready simulators
        run: |
          bazel run --config=ci //simfleet:prepare_simulators -- \
            --pool github-ci \
            --count 3 \
            --device-type "$SIMFLEET_DEVICE_TYPE" \
            --os-version "$SIMFLEET_OS_VERSION" \
            --certificate "$RUNNER_TEMP/simfleet-ci-root.pem" \
            --keep-booted

      - name: Run five UI methods across three simulators
        run: |
          bazel test --config=ci //tests/integration:MethodShardedUITests \
            --test_output=errors \
            --test_env=DEBUG_XCTESTRUNNER=1 \
            --local_resources=ios_simulator=3 \
            --@rules_apple//apple/build_settings:ios_simulator_device="$SIMFLEET_DEVICE_TYPE" \
            --@rules_apple//apple/build_settings:ios_simulator_version="$SIMFLEET_OS_VERSION"

      - name: Show prepared simulator state
        if: always()
        run: xcrun simctl list devices | grep -A 4 -B 1 simfleet_simulator || true

      - name: Upload UI test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-logs-${{ github.run_id }}
          path: bazel-testlogs/tests/integration/MethodShardedUITests/
          if-no-files-found: warn
          retention-days: 7
